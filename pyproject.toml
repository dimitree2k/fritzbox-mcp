[project]
name = "fritzbox-mcp"
version = "0.1.0"
description = "MCP server for Fritz!Box router management via Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.0,<3",
    "fritzconnection>=1.14.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "types-requests",
]

[tool.ruff.lint]
# BLE001 (blind except): tool boundaries deliberately catch Exception and
# return error JSON — a router hiccup must never kill the MCP session.
ignore = ["BLE001"]

[tool.mypy]
[[tool.mypy.overrides]]
module = "fritzconnection.*"
ignore_missing_imports = true
